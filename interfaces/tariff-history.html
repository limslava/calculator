<!DOCTYPE html>
<html lang="ru" class="history-embedded">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История загрузки тарифов - Администратор</title>
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/tariff-admin.css">
    <link rel="stylesheet" href="../styles/history-uploaded.css">
    <link rel="stylesheet" href="../styles/filters-scrollfix.css">
    <link rel="stylesheet" href="../styles/redesign.css">
    <!-- Библиотека для работы с иконками -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="history-embedded">
    <div class="container">
        <main>
            <section class="history-shell">
                <div class="history-topbar">
                    <div class="history-title">
                        <div class="history-subtitle">Администрирование</div>
                        <h2>История загрузок</h2>
                    </div>
                    <div class="history-actions">
                        <button class="history-btn" onclick="refreshHistory()">
                            <i class="fas fa-sync-alt"></i> Обновить
                        </button>
                        <button class="history-btn" onclick="exportToExcel()">
                            <i class="fas fa-file-excel"></i> Экспорт
                        </button>
                    </div>
                </div>

                <div id="filters" class="history-filters">
                    <div class="form-group">
                        <label for="data-type">Тип данных</label>
                        <select id="data-type" class="form-select">
                            <option value="all">Все типы</option>
                            <option value="sea">Морские перевозки</option>
                            <option value="rail">Железнодорожные перевозки</option>
                            <option value="direct_sea">Прямые морские перевозки</option>
                            <option value="direct_rail">Прямые железнодорожные перевозки</option>
                            <option value="tariff">Тарифы терминалов</option>
                            <option value="agent_tariff">Тарифы агентов</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date-from">Дата с</label>
                        <input type="date" id="date-from" class="form-input">
                    </div>

                    <div class="form-group">
                        <label for="date-to">Дата по</label>
                        <input type="date" id="date-to" class="form-input">
                    </div>

                    <div class="form-group">
                        <label for="user-filter">Пользователь</label>
                        <input type="text" id="user-filter" class="form-input" placeholder="Email пользователя">
                    </div>

                    <div class="history-filter-actions">
                        <button id="apply-filters" class="history-btn primary" onclick="applyFilters()">
                            <i class="fas fa-filter"></i> Применить
                        </button>
                        <button id="reset-filters" class="history-btn" onclick="resetFilters()">
                            <i class="fas fa-redo"></i> Сброс
                        </button>
                    </div>
                </div>

                <div id="history-table" class="history-table-card">
                    <div class="history-table-wrap">
                        <table id="history-table-content" class="history-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Тип данных</th>
                                    <th>Пользователь</th>
                                    <th>Кол-во записей</th>
                                    <th>Дата загрузки</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody id="history-table-body">
                                <!-- Данные будут загружены динамически -->
                                <tr>
                                    <td colspan="6" class="loading-cell">
                                        <div class="loading-spinner">
                                            <i class="fas fa-spinner fa-spin"></i>
                                            <span>Загрузка истории...</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="history-pagination">
                        <button id="prev-page" class="history-btn" disabled onclick="changePage(-1)">
                            <i class="fas fa-chevron-left"></i> Назад
                        </button>
                        <span id="page-info">Страница 1 из 1</span>
                        <button id="next-page" class="history-btn" disabled onclick="changePage(1)">
                            Вперед <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Модальное окно для детального просмотра -->
            <div id="detail-modal" class="modal hidden">
                <div class="modal-content wide-modal">
                    <div class="modal-header">
                        <h2>Детали загрузки</h2>
                        <button class="modal-close" onclick="closeDetailModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="detail-info">
                            <div class="detail-row">
                                <div class="detail-label">ID загрузки:</div>
                                <div class="detail-value" id="detail-id">-</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Тип данных:</div>
                                <div class="detail-value" id="detail-type">-</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Пользователь:</div>
                                <div class="detail-value" id="detail-user">-</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Дата загрузки:</div>
                                <div class="detail-value" id="detail-date">-</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">Количество записей:</div>
                                <div class="detail-value" id="detail-count">-</div>
                            </div>
                        </div>
                        
                        <div class="detail-section">
                            <h3>Предпросмотр данных</h3>
                            <div id="detail-preview" class="data-preview">
                                <!-- Предпросмотр данных будет загружен здесь -->
                            </div>
                        </div>
                        
                        <div class="detail-actions">
                            <button class="btn-secondary" onclick="closeDetailModal()">
                                <i class="fas fa-times"></i> Закрыть
                            </button>
                            <button class="btn-primary" onclick="exportDetailData()">
                                <i class="fas fa-download"></i> Экспорт в Excel
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Загружаем модули -->
    <!-- Библиотека для работы с Excel файлами -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="../scripts/server-auth.js"></script>
    <script src="../scripts/utils.js"></script>
    <script src="../scripts/tariff-history.js"></script>
</body>
</html>
