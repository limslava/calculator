name: Deploy to Amvera

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test
      
    - name: Build Docker image
      run: |
        docker build -t logistics-calculator .
        
    - name: Test Docker container
      run: |
        docker run -d --name test-app -p 3001:3001 logistics-calculator
        sleep 10
        curl -f http://localhost:3001 || exit 1
        docker stop test-app
        docker rm test-app
        
    - name: Deploy to Amvera
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        echo "Для развертывания на Amvera выполните следующие шаги:"
        echo "1. Перейдите на https://cloud.amvera.ru"
        echo "2. Создайте новый проект"
        echo "3. Выберите 'Из Git репозитория'"
        echo "4. Укажите URL: https://github.com/limslava/calculator"
        echo "5. Amvera автоматически обнаружит amvera.yml и развернет приложение"