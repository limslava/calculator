name: Deploy to Amvera

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test
      
    - name: Build Docker image
      run: |
        docker build -t logistics-calculator .
        
    - name: Test Docker container
      run: |
        docker run -d --name test-app -p 3000:3000 logistics-calculator
        sleep 10
        curl -f http://localhost:3000 || exit 1
        docker stop test-app
        docker rm test-app
        
    - name: Deploy to Amvera
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        echo "✅ Приложение готово к развертыванию на Amvera!"
        echo "📋 Инструкции по развертыванию:"
        echo "1. Перейдите на https://cloud.amvera.ru"
        echo "2. Создайте новый проект 'logistics-calculator'"
        echo "3. Выберите 'Из Git репозитория'"
        echo "4. Укажите URL вашего репозитория"
        echo "5. Amvera автоматически обнаружит amvera.yml и развернет приложение"
        echo "6. После развертывания приложение будет доступно по адресу: https://logistics-calculator.amvera.io"