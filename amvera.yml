name: logistics-calculator
services:
  web:
    build: .
    ports:
      - 3000:3001
    environment:
      - NODE_ENV=production
      - PORT=3001
    resources:
      memory: 512Mi
      cpu: 500m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s