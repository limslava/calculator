name: logistics-calculator
services:
  web:
    build: .
    ports:
      - 80:3000
    environment:
      - NODE_ENV=production
      - PORT=3000
    resources:
      memory: 512Mi
      cpu: 500m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s